<app-header />
<main>
  <!-- newer way for if else and for loop -->
  <ul id="users">
    @for(user of users; track user.id){
    <li>
      <app-user
        [user]="user"
        [selected]="user.id === selectedUserId"
        (select)="onSelectUser($event)"
      />
    </li>
    }
  </ul>

  @if (selectedUser) {
  <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name" />
  } @else {
  <p id="fallback">Select a user to see their tasks!</p>
  }

  <!-- older/legacy way for if else and for loop -->
  <!-- <ul id="users">

    <app-tasks *ngIf="selectedUser; else elseblock" [name]="selectedUser!.name" />
    <ng-template #elseblock>
        <p id="fallback">Select a user to see their tasks!</p>
    </ng-template> -->
</main>
